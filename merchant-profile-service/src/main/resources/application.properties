
# Pagination Values 
merchant.pagination.default-size=20
merchant.pagination.max-size=100


# @ConfigProperty(name = "merchant.pagination.default-size", defaultValue = "20")
# int defaultPageSize;
# @ConfigProperty(name = "merchant.pagination.max-size", defaultValue = "100")
# int maxPageSize;


# PostgresSQL Config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=merchant_user
quarkus.datasource.password=merchant_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/merchant_db

quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.min-size=1

# Flyway Config
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Hibernate ORM Config over Flyway schema
#schema-management.strategy=none ensures hibernate never manipulate tables, flway owns schema changes
quarkus.hibernate-orm.schema-management.strategy=none   
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true